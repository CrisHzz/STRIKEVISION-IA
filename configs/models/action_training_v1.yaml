schema_version: action_training_v1
dataset_config: configs/models/action_recognition_v1.yaml
dataset_root: data/processed/datasets/action_recognition_v1
output_root: outputs/action-recognition
seed: 20261021
feature_extraction:
  steps: 32
  context_seconds: 0.8
sampling:
  # Preserve all technique labels and select confirmed no-strike windows per
  # split/fight reproducibly. This avoids 32k negatives masking 1.8k actions.
  negative_to_positive_ratio: 2.0
models:
  baseline: [logistic_regression, extra_trees]
  temporal: [tcn, stgcn_compact]
  video: [x3d_linear_probe]
tuning:
  max_epochs: 50
  patience: 6
  trials_per_finalist: 20
  selection_metric: primary_macro_f1
