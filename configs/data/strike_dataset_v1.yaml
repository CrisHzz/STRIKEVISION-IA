schema_version: strike_dataset_v1
annotations_dir: data/annotations/strike_annotations_v1
splits_manifest: data/metadata/splits_manifest.csv
annotation_config: configs/data/strike_annotations_v1.yaml
# Exclusions are logical, not deletions. Never silently import historical pilots.
excluded_files:
  yan_sandhagen__petr_yan_vs_cory_sandhagen__normal_men_round2.jsonl: user_excluded_unlabeled_round
  topuria_gaethje_round2.jsonl: historical_pilot_use_complete_round_instead
training_labels: [strike, no_strike]
# Unknown windows remain available for inspection, never mapped to no_strike.
retain_low_pose_quality: true
# Visual QA: old and rebuilt R3/R4 select referee/spectators in multiple samples.
# Keep every human label (usable with video); mask these untrusted pose inputs.
untrusted_pose_videos:
  adesanya_pereira_1__israel_adesanya_vs_alex_pereira_1__aggressive_men_round3: referee_and_spectator_identity_errors_in_visual_review
  adesanya_pereira_1__israel_adesanya_vs_alex_pereira_1__aggressive_men_round4: referee_and_spectator_identity_errors_in_visual_review
