schema_version: strike_annotations_v1
pose_version: pose_dataset_v1
window_frames: 24
# 0.4 seconds at 30 fps: preserves temporal overlap without quadrupling manual labels.
stride_frames: 12
expected_fighters: 2
quality_thresholds:
  min_two_fighter_frame_ratio: 0.75
  min_two_pose_valid_frame_ratio: 0.75
  min_required_keypoint_ratio: 0.55
labels:
  - strike
  - no_strike
  - unknown_occluded
required_keypoints:
  - left_shoulder
  - right_shoulder
  - left_elbow
  - right_elbow
  - left_wrist
  - right_wrist
  - left_knee
  - right_knee
  - left_ankle
  - right_ankle
